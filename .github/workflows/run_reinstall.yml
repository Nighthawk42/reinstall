name: Run main script
on:
  workflow_dispatch:
  push:
    paths:
      - "reinstall.*"
jobs:
  run:
    name: Run main script
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            command: sudo bash reinstall.sh --debug --username x --password x
            command_no_username_option: sudo bash reinstall.sh --debug
          - os: windows-latest
            command: ./reinstall.bat --debug --username x --password x
            command_no_username_option: ./reinstall.bat --debug
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: |
          # ${{ matrix.command }} centos
          ${{ matrix.command }} almalinux
          # ${{ matrix.command }} rocky
          # ${{ matrix.command }} fedora
          ${{ matrix.command }} ubuntu
          ${{ matrix.command }} debian
          ${{ matrix.command }} debian --ci
          # ${{ matrix.command }} kali
          # ${{ matrix.command }} alpine
          # ${{ matrix.command }} opensuse
          # ${{ matrix.command }} arch

          ${{ matrix.command_no_username_option }} netboot.xyz
          ${{ matrix.command }} dd --img=https://cloud.debian.org/images/cloud/sid/daily/latest/debian-sid-nocloud-amd64-daily.tar.xz
          ${{ matrix.command }} windows --image-name='Windows Server blah' --iso https://aka.ms/HCIReleaseImage

          ${{ matrix.command }} reset

          # Failure test cases
          # ${{ matrix.command }} wrong-os
          # ${{ matrix.command }} dd --img=https://github.com/
          # ${{ matrix.command }} windows --iso=https://github.com/ --image-name=abc

      # --ssh-key may be given alone or together with --password.
      # reinstall.sh must then put the matching files into the netboot initrd, so
      # that a key which fails to land still leaves password login available.
      # The runner never reboots, so trans.sh is not exercised here.
      - if: matrix.os == 'ubuntu-latest'
        env:
          CI_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAtfsTcPBuE1o56Ds4S2nC60KDPb7601IG31z3Uj0eUR ci-example-key
        run: |
          sudo bash reinstall.sh --debug --username x --ssh-key "$CI_PUBKEY" debian
          sudo test -s /reinstall-tmp/initrd/configs/ssh_keys
          sudo test ! -e /reinstall-tmp/initrd/configs/password-linux-sha512

          sudo bash reinstall.sh --debug --username x --password x --ssh-key "$CI_PUBKEY" debian
          sudo test -s /reinstall-tmp/initrd/configs/ssh_keys
          sudo test -s /reinstall-tmp/initrd/configs/password-linux-sha512
