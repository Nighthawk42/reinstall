# shellcheck disable=SC2148
# Settings
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone Asia/Shanghai --utc
rootpw --plaintext 123@@@
text
reboot
%include /tmp/include-url-command

# Partitioning
%include /tmp/include-disk-only-use
%include /tmp/include-bootloader
clearpart --all --initlabel
reqpart # automatically create an efi or biosboot partition if needed
part / --fstype=xfs --grow

# Packages
%packages --ignoremissing # the el9 minimal.iso and fedora Server repo/iso have no tuned
@^Minimal Install
%include /tmp/include-packages-for-resize
%include /tmp/exclude-packages-for-vm
%end

# Disable the firewall
# firewall --disabled

# Disable selinux
selinux --disabled

# Disable kdump
%addon com_redhat_kdump --disable
%end

##############################################
%pre
distro=$(awk -F: '{ print $3 }' </etc/system-release-cpe)
releasever=$(awk -F: '{ print $5 }' </etc/system-release-cpe)

# Rebuild extra: grub eats the surrounding quotes, which breaks eval, so re-add them
# Extract extra_confhome, extra_mirrorlist and extra_main_disk
prefix=extra
for var in $(grep -o "\b${prefix}_[^ ]*" /proc/cmdline | xargs); do
    eval "$(echo "$var" | sed -E "s/${prefix}_([^=]*)=(.*)/\1='\2'/")"
done

# centos7 has an outdated certificate chain, so --no-check-certificate is required

# Use the main disk only
include=/tmp/include-disk-only-use
xda=$(wget --no-check-certificate --tries=5 "$confhome/get-xda.sh" -O- | sh -s)
echo "ignoredisk --only-use=$xda" >$include

# Configure the tty
include=/tmp/include-bootloader
# shellcheck disable=SC2154
console_cmdline=$(wget --no-check-certificate --tries=5 "$confhome/ttys.sh" -O- | sh -s console=)
echo "bootloader --append=\"$console_cmdline\"" >$include

# An installer partition means the two-step install was used
include=/tmp/include-packages-for-resize
touch $include
if [ -e /dev/disk/by-label/installer ]; then
    # with 1G RAM the installer enables zram by default, but that is still not enough for f38
    # which shows up as the installer UI restarting repeatedly, so enable swap too
    ram_size=$(lsmem -b 2>/dev/null | grep 'Total online memory:' | awk '{ print $NF/1024/1024 }')
    if [ -z "$ram_size" ] || [ "$ram_size" -le 1024 ]; then
        mount /dev/disk/by-label/installer /run/install/repo -o remount,rw
        swapfile=/run/install/repo/swapfile
        if command -v fallocate; then
            fallocate -l 1G $swapfile
        else
            dd if=/dev/zero of=$swapfile bs=1M count=1024
        fi
        chmod 0600 $swapfile
        mkswap $swapfile
        swapon $swapfile
    fi

    # fedora does not include cronie by default
    echo cronie >>$include

    # el7's parted cannot grow a partition online, so use growpart and gdisk for gpt
    if [ "$releasever" = "7" ]; then
        echo cloud-utils-growpart >>$include
        echo gdisk >>$include
    fi
fi

# Exclude components a VM does not need
include=/tmp/exclude-packages-for-vm
touch $include
if systemd-detect-virt -v; then
    cat <<EOF >$include
        # keep the usb packages: Oracle Cloud has usb devices, purpose unknown
        # -usb_modeswitch
        # -usbutils

        # wireless
        -iw
        -crda
        -rfkill
        -iwl*-firmware

        # misc
        -irqbalance # maybe useful with many cores + passthrough devices?
        -microcode_ctl
        -smartmontools

        # assorted firmware
        -aic94xx-firmware
        -alsa-firmware
        -ivtv-firmware
        # -linux-firmware # removing this makes a centos 8 install fail

        # fedora-specific firmware
        -amd-gpu-firmware
        -atheros-firmware
        -brcmfmac-firmware
        -intel-gpu-firmware
        -mt7xxx-firmware
        -nvidia-gpu-firmware
        -realtek-firmware
EOF
fi

# Configure the install repositories
include=/tmp/include-url-command
# shellcheck disable=SC2154
if [ "$localtest" = 1 ]; then
    echo "url --url=$confhome/$releasever/" >$include
    # echo cdrom >$include
else
    echo "url --mirrorlist=$mirrorlist" >$include
    # on el7/fedora the updates repo must be added to get the newest packages
    if [ "$releasever" = "7" ] || [ "$distro" = "fedoraproject" ]; then
        echo "repo --name=updates" >>$include
    fi
fi
%end

##############################################
%post
# sshd on el9/fedora disallows root password login by default; enable it manually
# rootpw --allow-ssh is only supported on 9.1 and newer
distro=$(awk -F: '{ print $3 }' </etc/system-release-cpe)
releasever=$(awk -F: '{ print $5 }' </etc/system-release-cpe)
if [ "$releasever" = "9" ] || [ "$distro" = "fedoraproject" ]; then
    echo "PermitRootLogin yes" >/etc/ssh/sshd_config.d/01-permitrootlogin.conf
fi

# For a two-step install, merge the last partition (installer) into the system partition
if [ -e /dev/disk/by-label/installer ]; then
    # Extract extra_localtest, extra_confhome and extra_mirrorlist
    prefix=extra
    for var in $(grep -o "\b${prefix}_[^ ]*" /proc/cmdline | xargs); do
        eval "$(echo "$var" | sed -E "s/${prefix}_([^=]*)=(.*)/\1='\2'/")"
    done

    cd /
    curl -O "$confhome/deprecated/resize.sh"
    echo '@reboot root bash /resize.sh' >/etc/cron.d/resize
fi
%end
